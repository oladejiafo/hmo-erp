# docker-compose.yml (partial - add to your existing compose file)
#
# This shows how to add the AI microservice alongside your existing Laravel app.
# The ai-service container is NOT exposed to the internet - only the Laravel
# app can reach it on the internal `hmo_network`.

version: "3.9"

services:

  # ── Existing Laravel App ────────────────────────────────────────────────────
  app:
    build: .
    environment:
      AI_SERVICE_URL: http://ai-service:8004
      AI_SERVICE_KEY: "${AI_SERVICE_KEY}"
      AI_SERVICE_TIMEOUT: "30"
    depends_on:
      - ai-service
    networks:
      - hmo_network

  # ── AI Microservice ─────────────────────────────────────────────────────────
  ai-service:
    build: ./ai-microservice
    environment:
      AI_SERVICE_KEY:   "${AI_SERVICE_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY:   "${OPENAI_API_KEY}"    # Optional
      AI_MODEL:         "claude-3-5-sonnet-20241022"
      AI_MAX_TOKENS:    "1024"
      LOG_LEVEL:        "info"
    # DO NOT add 'ports' here - only reachable from Laravel (internal network)
    # For local dev, you can temporarily add: ports: ["8001:8001"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hmo_network
    # Resource limits - AI calls can be memory-intensive
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  hmo_network:
    driver: bridge